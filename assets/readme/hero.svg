<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">Godot Noob Accelerator</title>
  <desc id="d">A friendly round robot named Pip, holding a game controller, beside the title: make a Godot game with Claude Code, without the mess.</desc>
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
    .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 1010px 250px; }
    .tw1 { animation: tw 2.4s ease-in-out infinite; }
    .tw2 { animation: tw 2.4s ease-in-out 0.8s infinite; }
    .tw3 { animation: tw 2.4s ease-in-out 1.6s infinite; }
    .blink { animation: blink 5s infinite; transform-origin: 0 214px; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .bob, .tw1, .tw2, .tw3, .blink { animation: none; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4E2"/>
      <stop offset="0.55" stop-color="#E4F1FB"/>
      <stop offset="1" stop-color="#CFE6F7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FA3D6"/>
      <stop offset="1" stop-color="#3D7CB3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="36" fill="url(#sky)"/>

  <!-- floating bits: pixel blocks, stars, a coin -->
  <g class="tw1"><rect x="760" y="70" width="26" height="26" rx="5" fill="#F6C453"/><rect x="786" y="70" width="26" height="26" rx="5" fill="#F2B33D"/></g>
  <g class="tw2"><path d="M1198 92 l9 20 22 3 -16 15 4 22 -19 -11 -19 11 4 -22 -16 -15 22 -3z" fill="#EF7FA0"/></g>
  <g class="tw3"><circle cx="1170" cy="360" r="16" fill="#F6C453" stroke="#E09B2D" stroke-width="5"/></g>
  <g class="tw2"><path d="M820 350 l6 13 14 2 -10 10 3 14 -13 -7 -13 7 3 -14 -10 -10 14 -2z" fill="#5CC8A8"/></g>
  <g class="tw1"><rect x="1236" y="232" width="18" height="18" rx="4" fill="#D97757"/></g>
  <circle cx="900" cy="118" r="7" fill="#478CBF" opacity="0.5"/>
  <circle cx="1120" cy="180" r="5" fill="#D97757" opacity="0.6"/>

  <!-- title -->
  <g class="f">
    <rect x="64" y="64" width="276" height="38" rx="19" fill="#1E2A44"/>
    <text x="202" y="89" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF4E2" letter-spacing="1.5">CLAUDE CODE × GODOT 4</text>
    <text x="64" y="176" font-size="68" font-weight="800" fill="#1E2A44">Godot Noob</text>
    <text x="64" y="252" font-size="68" font-weight="800" fill="#D97757">Accelerator</text>
    <text x="66" y="306" font-size="27" fill="#2F3D5C">Make a Godot game with Claude Code,</text>
    <text x="66" y="342" font-size="27" fill="#2F3D5C">without the mess. Built by a beginner, for beginners.</text>
    <g font-size="17" font-weight="700">
      <rect x="64" y="368" width="88" height="34" rx="17" fill="#5CC8A8"/><text x="108" y="391" text-anchor="middle" fill="#123B33">free</text>
      <rect x="162" y="368" width="138" height="34" rx="17" fill="#F6C453"/><text x="231" y="391" text-anchor="middle" fill="#4A3300">open source</text>
      <rect x="310" y="368" width="290" height="34" rx="17" fill="#EF7FA0"/><text x="455" y="391" text-anchor="middle" fill="#4A1024">no coding experience needed</text>
    </g>
  </g>

  <!-- Pip the robot -->
  <ellipse cx="1010" cy="400" rx="120" ry="16" fill="#1E2A44" opacity="0.12"/>
  <g class="bob">
    <!-- antenna -->
    <line x1="1010" y1="112" x2="1010" y2="146" stroke="#1E2A44" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1010" cy="104" r="15" fill="#D97757"/>
    <circle cx="1005" cy="99" r="5" fill="#FFD1BF"/>
    <!-- head -->
    <rect x="900" y="144" width="220" height="150" rx="58" fill="url(#body)" stroke="#1E2A44" stroke-width="7"/>
    <rect x="928" y="170" width="164" height="96" rx="40" fill="#FFF8EE"/>
    <g class="blink">
      <ellipse cx="976" cy="214" rx="15" ry="19" fill="#1E2A44"/>
      <ellipse cx="1044" cy="214" rx="15" ry="19" fill="#1E2A44"/>
      <circle cx="981" cy="207" r="5" fill="#FFFFFF"/>
      <circle cx="1049" cy="207" r="5" fill="#FFFFFF"/>
    </g>
    <path d="M988 244 q22 18 44 0" fill="none" stroke="#1E2A44" stroke-width="6" stroke-linecap="round"/>
    <circle cx="950" cy="240" r="9" fill="#EF7FA0" opacity="0.7"/>
    <circle cx="1070" cy="240" r="9" fill="#EF7FA0" opacity="0.7"/>
    <!-- body -->
    <rect x="934" y="290" width="152" height="86" rx="30" fill="url(#body)" stroke="#1E2A44" stroke-width="7"/>
    <!-- controller held in front -->
    <rect x="944" y="306" width="132" height="58" rx="26" fill="#1E2A44"/>
    <rect x="964" y="327" width="26" height="9" rx="3" fill="#FFF4E2"/>
    <rect x="972" y="319" width="9" height="26" rx="3" fill="#FFF4E2"/>
    <circle cx="1040" cy="324" r="7" fill="#F6C453"/>
    <circle cx="1056" cy="338" r="7" fill="#5CC8A8"/>
    <circle cx="1040" cy="350" r="7" fill="#EF7FA0"/>
    <!-- arms -->
    <path d="M934 318 q-30 4 -26 34" fill="none" stroke="#1E2A44" stroke-width="7" stroke-linecap="round"/>
    <path d="M1086 318 q30 4 26 34" fill="none" stroke="#1E2A44" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
