<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
<title id="t">Godot Noob Accelerator</title>
<desc id="d">Pip, a friendly round robot holding a game controller, beside the title: Godot Noob Accelerator. Make a Godot game with Claude Code, without the mess.</desc>
<style>.bob{animation:bob 3.2s ease-in-out infinite}.tw1{animation:tw 2.4s ease-in-out infinite}.tw2{animation:tw 2.4s ease-in-out .8s infinite}.tw3{animation:tw 2.4s ease-in-out 1.6s infinite}.blink{animation:blink 5s infinite;transform-origin:0 125px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){.bob,.tw1,.tw2,.tw3,.blink{animation:none}}</style>
