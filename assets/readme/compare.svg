<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 778" width="1280" height="778" role="img" aria-labelledby="t d">
<title id="t">Plain Claude Code, or with the kit?</title>
<desc id="d">A comparison in five rows. A new session: plain Claude Code remembers little; with the kit it reads its notes. When it says it works: plain, often untested; with the kit, the checks ran first. Your hand-tuned jump: plain can change it back; the kit treats it as yours. A big feature: plain starts coding; the kit asks a few questions and writes a plan for your OK. Two computers: plain can redo work; the kit fetches first and asks before pulling.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5878"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="1280" height="778" rx="32" fill="#FFF7EC"/>
<g transform="translate(0 -92)">
<rect x="372" y="118" width="281" height="42" rx="21" fill="#EE7FA0"/><text x="512" y="147" font-size="24" font-weight="700" fill="#4A1024" text-anchor="middle">Plain Claude Code</text>
<rect x="828" y="118" width="209" height="42" rx="21" fill="#5CC8A8"/><text x="932" y="147" font-size="24" font-weight="700" fill="#123B33" text-anchor="middle">With the kit</text>
<rect x="48" y="190" width="1184" height="116" rx="20" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<text x="74" y="252" font-size="26" font-weight="700" fill="#1E2A44" text-anchor="start">A new session</text>
<circle cx="394" cy="248" r="18" fill="#EE7FA0"/><path d="M387.16 241.16 L400.84 254.84 M400.84 241.16 L387.16 254.84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="426" y="235" font-size="24" fill="#4A5878" text-anchor="start">Remembers little. You explain</text>
<text x="426" y="268" font-size="24" fill="#4A5878" text-anchor="start">it all again.</text>
<circle cx="850" cy="248" r="18" fill="#5CC8A8"/><path d="M841.9 248 l5.76 6.12 l10.799999999999999 -11.88" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="235" font-size="24" fill="#1E2A44" text-anchor="start">Reads its notes: where you</text>
<text x="882" y="268" font-size="24" fill="#1E2A44" text-anchor="start">stopped, what&#x27;s next.</text>
<rect x="48" y="320" width="1184" height="116" rx="20" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<text x="74" y="382" font-size="26" font-weight="700" fill="#1E2A44" text-anchor="start">&quot;It works!&quot;</text>
<circle cx="394" cy="378" r="18" fill="#EE7FA0"/><path d="M387.16 371.16 L400.84 384.84 M400.84 371.16 L387.16 384.84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="426" y="365" font-size="24" fill="#4A5878" text-anchor="start">Often untested. You find the</text>
<text x="426" y="398" font-size="24" fill="#4A5878" text-anchor="start">bugs.</text>
<circle cx="850" cy="378" r="18" fill="#5CC8A8"/><path d="M841.9 378 l5.76 6.12 l10.799999999999999 -11.88" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="365" font-size="24" fill="#1E2A44" text-anchor="start">The checks ran first, and it</text>
<text x="882" y="398" font-size="24" fill="#1E2A44" text-anchor="start">tells you what they said.</text>
<rect x="48" y="450" width="1184" height="116" rx="20" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<text x="74" y="494" font-size="26" font-weight="700" fill="#1E2A44" text-anchor="start">Your hand-tuned</text>
<text x="74" y="530" font-size="26" font-weight="700" fill="#1E2A44" text-anchor="start">jump</text>
<circle cx="394" cy="508" r="18" fill="#EE7FA0"/><path d="M387.16 501.16 L400.84 514.84 M400.84 501.16 L387.16 514.84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="426" y="512" font-size="24" fill="#4A5878" text-anchor="start">Can quietly change it back.</text>
<circle cx="850" cy="508" r="18" fill="#5CC8A8"/><path d="M841.9 508 l5.76 6.12 l10.799999999999999 -11.88" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="495" font-size="24" fill="#1E2A44" text-anchor="start">Treated as yours. It asks</text>
<text x="882" y="528" font-size="24" fill="#1E2A44" text-anchor="start">before touching it.</text>
<rect x="48" y="580" width="1184" height="116" rx="20" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<text x="74" y="642" font-size="26" font-weight="700" fill="#1E2A44" text-anchor="start">A big new feature</text>
<circle cx="394" cy="638" r="18" fill="#EE7FA0"/><path d="M387.16 631.16 L400.84 644.84 M400.84 631.16 L387.16 644.84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="426" y="642" font-size="24" fill="#4A5878" text-anchor="start">Starts coding straight away.</text>
<circle cx="850" cy="638" r="18" fill="#5CC8A8"/><path d="M841.9 638 l5.76 6.12 l10.799999999999999 -11.88" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="625" font-size="24" fill="#1E2A44" text-anchor="start">A few questions, a short plan,</text>
<text x="882" y="658" font-size="24" fill="#1E2A44" text-anchor="start">then your OK.</text>
<rect x="48" y="710" width="1184" height="116" rx="20" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<text x="74" y="772" font-size="26" font-weight="700" fill="#1E2A44" text-anchor="start">Two computers</text>
<circle cx="394" cy="768" r="18" fill="#EE7FA0"/><path d="M387.16 761.16 L400.84 774.84 M400.84 761.16 L387.16 774.84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="426" y="755" font-size="24" fill="#4A5878" text-anchor="start">One can redo what the other</text>
<text x="426" y="788" font-size="24" fill="#4A5878" text-anchor="start">already did.</text>
<circle cx="850" cy="768" r="18" fill="#5CC8A8"/><path d="M841.9 768 l5.76 6.12 l10.799999999999999 -11.88" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="755" font-size="24" fill="#1E2A44" text-anchor="start">It fetches first and asks</text>
<text x="882" y="788" font-size="24" fill="#1E2A44" text-anchor="start">before pulling.</text>
</g>
</g>
</svg>
