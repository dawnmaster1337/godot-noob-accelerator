<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1148" width="760" height="1148" role="img" aria-labelledby="t d">
<title id="t">What a session looks like</title>
<desc id="d">An illustrated chat. You type resume; Claude says it got two changes from your laptop, names the next task and asks one question with a recommended answer. You type APR; it builds it and reports 4 checks passed and what to try. You say it feels floaty; it changes one setting, not code. You say save work; it asks before committing.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#A9B5C9"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="2" y="2" width="757" height="1145" rx="28" fill="#101622" stroke="#2B3547" stroke-width="3"/>
<path d="M1.5 30 a28 28 0 0 1 28 -28 h701 a28 28 0 0 1 28 28 v40 h-757z" fill="#0A0E15"/>
<circle cx="40" cy="36" r="9" fill="#EE7FA0"/>
<circle cx="68" cy="36" r="9" fill="#F5C24C"/>
<circle cx="96" cy="36" r="9" fill="#5CC8A8"/>
<text x="380" y="45" font-size="22" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#C9D3E3" text-anchor="middle">claude  ·  your-game</text>
<rect x="567" y="96" width="157" height="60" rx="30" fill="#D97757"/>
<text x="646" y="136" font-size="28" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#FFFFFF" text-anchor="middle">resume</text>
<g transform="translate(22 172) scale(0.5)">
  <line x1="80" y1="6" x2="80" y2="28" stroke="#93A4BF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="10" r="11" fill="#D97757"/>
  <rect x="10" y="26" width="140" height="104" rx="42" fill="#5FA3D6" stroke="#0A0E15" stroke-width="6"/>
  <rect x="30" y="44" width="100" height="68" rx="28" fill="#FFF8EE"/>
  <ellipse cx="60" cy="74" rx="10" ry="13" fill="#1E2A44"/><ellipse cx="100" cy="74" rx="10" ry="13" fill="#1E2A44"/>
  <circle cx="63" cy="69" r="3.5" fill="#FFF"/><circle cx="103" cy="69" r="3.5" fill="#FFF"/>
  <path d="M62 92 q18 15 36 0" fill="none" stroke="#1E2A44" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="92" r="7" fill="#EE7FA0" opacity=".7"/><circle cx="120" cy="92" r="7" fill="#EE7FA0" opacity=".7"/>
</g>
<rect x="112" y="174" width="590" height="220" rx="24" fill="#1F2735" stroke="#35415A" stroke-width="3"/>
<text x="138" y="222" font-size="26" fill="#EEF2F8" text-anchor="start">Got 2 changes from your laptop.</text>
<text x="138" y="258" font-size="26" fill="#EEF2F8" text-anchor="start">Next up: the wall jump. One question:</text>
<text x="138" y="294" font-size="26" fill="#EEF2F8" text-anchor="start">should it push you off the wall?</text>
<text x="138" y="330" font-size="26" fill="#EEF2F8" text-anchor="start">1. Yes, a little (recommended)</text>
<text x="138" y="366" font-size="26" fill="#EEF2F8" text-anchor="start">2. Straight up</text>
<rect x="618" y="418" width="106" height="60" rx="30" fill="#D97757"/>
<text x="671" y="458" font-size="28" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#FFFFFF" text-anchor="middle">APR</text>
<g transform="translate(22 494) scale(0.5)">
  <line x1="80" y1="6" x2="80" y2="28" stroke="#93A4BF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="10" r="11" fill="#D97757"/>
  <rect x="10" y="26" width="140" height="104" rx="42" fill="#5FA3D6" stroke="#0A0E15" stroke-width="6"/>
  <rect x="30" y="44" width="100" height="68" rx="28" fill="#FFF8EE"/>
  <ellipse cx="60" cy="74" rx="10" ry="13" fill="#1E2A44"/><ellipse cx="100" cy="74" rx="10" ry="13" fill="#1E2A44"/>
  <circle cx="63" cy="69" r="3.5" fill="#FFF"/><circle cx="103" cy="69" r="3.5" fill="#FFF"/>
  <path d="M62 92 q18 15 36 0" fill="none" stroke="#1E2A44" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="92" r="7" fill="#EE7FA0" opacity=".7"/><circle cx="120" cy="92" r="7" fill="#EE7FA0" opacity=".7"/>
</g>
<rect x="112" y="496" width="590" height="148" rx="24" fill="#1F2735" stroke="#35415A" stroke-width="3"/>
<text x="138" y="544" font-size="26" font-weight="700" fill="#EEF2F8" text-anchor="start">Built it. Checks: 4 passed, 0 failed.</text>
<text x="138" y="580" font-size="26" fill="#EEF2F8" text-anchor="start">To try: open player.tscn, press F5 and</text>
<text x="138" y="616" font-size="26" fill="#EEF2F8" text-anchor="start">jump at a wall twice.</text>
<rect x="466" y="668" width="258" height="60" rx="30" fill="#D97757"/>
<text x="595" y="708" font-size="28" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#FFFFFF" text-anchor="middle">feels floaty</text>
<g transform="translate(22 744) scale(0.5)">
  <line x1="80" y1="6" x2="80" y2="28" stroke="#93A4BF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="10" r="11" fill="#D97757"/>
  <rect x="10" y="26" width="140" height="104" rx="42" fill="#5FA3D6" stroke="#0A0E15" stroke-width="6"/>
  <rect x="30" y="44" width="100" height="68" rx="28" fill="#FFF8EE"/>
  <ellipse cx="60" cy="74" rx="10" ry="13" fill="#1E2A44"/><ellipse cx="100" cy="74" rx="10" ry="13" fill="#1E2A44"/>
  <circle cx="63" cy="69" r="3.5" fill="#FFF"/><circle cx="103" cy="69" r="3.5" fill="#FFF"/>
  <path d="M62 92 q18 15 36 0" fill="none" stroke="#1E2A44" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="92" r="7" fill="#EE7FA0" opacity=".7"/><circle cx="120" cy="92" r="7" fill="#EE7FA0" opacity=".7"/>
</g>
<rect x="112" y="746" width="590" height="148" rx="24" fill="#1F2735" stroke="#35415A" stroke-width="3"/>
<text x="138" y="794" font-size="26" fill="#EEF2F8" text-anchor="start">That&#x27;s a setting, not code.</text>
<text x="138" y="830" font-size="26" fill="#EEF2F8" text-anchor="start">I changed wall_jump_push from 220 to 160.</text>
<text x="138" y="866" font-size="26" fill="#EEF2F8" text-anchor="start">Try it again?</text>
<rect x="382" y="918" width="342" height="60" rx="30" fill="#D97757"/>
<text x="553" y="958" font-size="28" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#FFFFFF" text-anchor="middle">better. save work</text>
<g transform="translate(22 994) scale(0.5)">
  <line x1="80" y1="6" x2="80" y2="28" stroke="#93A4BF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="10" r="11" fill="#D97757"/>
  <rect x="10" y="26" width="140" height="104" rx="42" fill="#5FA3D6" stroke="#0A0E15" stroke-width="6"/>
  <rect x="30" y="44" width="100" height="68" rx="28" fill="#FFF8EE"/>
  <ellipse cx="60" cy="74" rx="10" ry="13" fill="#1E2A44"/><ellipse cx="100" cy="74" rx="10" ry="13" fill="#1E2A44"/>
  <circle cx="63" cy="69" r="3.5" fill="#FFF"/><circle cx="103" cy="69" r="3.5" fill="#FFF"/>
  <path d="M62 92 q18 15 36 0" fill="none" stroke="#1E2A44" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="92" r="7" fill="#EE7FA0" opacity=".7"/><circle cx="120" cy="92" r="7" fill="#EE7FA0" opacity=".7"/>
</g>
<rect x="112" y="996" width="590" height="112" rx="24" fill="#1F2735" stroke="#35415A" stroke-width="3"/>
<text x="138" y="1044" font-size="26" fill="#EEF2F8" text-anchor="start">Commit &quot;Add the wall jump&quot;?</text>
<text x="138" y="1080" font-size="26" fill="#EEF2F8" text-anchor="start">Nothing is saved until you say yes.</text>
</g>
</svg>
