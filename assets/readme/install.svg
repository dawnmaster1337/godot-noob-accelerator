<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 494" width="1280" height="494" role="img" aria-labelledby="t d">
<title id="t">Install in four steps</title>
<desc id="d">Four steps: get Godot, git and Claude Code; add the kit with two commands; open Claude Code in your game&#x27;s folder; type /godot-accel:bootstrap and answer a few questions.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5878"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="1280" height="494" rx="32" fill="#FFF7EC"/>
<g transform="translate(0 -112)">
<rect x="52" y="172" width="276" height="390" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="104" cy="228" r="30" fill="#5FA3D6" stroke="#1E2A44" stroke-width="4"/><text x="104" y="240" font-size="33" font-weight="700" fill="#0E2C44" text-anchor="middle">1</text>
<g transform="translate(236 194) scale(0.95)" fill="none" stroke="#1E2A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20 l24 -12 l24 12 v26 l-24 12 l-24 -12z M8 20 l24 12 l24 -12 M32 32 v26"/></g>
<text x="78" y="314" font-size="29" font-weight="700" fill="#1E2A44" text-anchor="start">Get the tools</text>
<text x="78" y="364" font-size="23" fill="#1E2A44" text-anchor="start">Godot and git</text>
<text x="78" y="396" font-size="23" fill="#1E2A44" text-anchor="start">(free), and Claude</text>
<text x="78" y="427" font-size="23" fill="#1E2A44" text-anchor="start">Code (needs a paid</text>
<text x="78" y="459" font-size="23" fill="#1E2A44" text-anchor="start">Claude plan).</text>
<line x1="332" y1="367" x2="352" y2="367" stroke="#4A5878" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="356" y="172" width="276" height="390" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="408" cy="228" r="30" fill="#F5C24C" stroke="#1E2A44" stroke-width="4"/><text x="408" y="240" font-size="33" font-weight="700" fill="#4A3300" text-anchor="middle">2</text>
<g transform="translate(540 194) scale(0.95)" fill="none" stroke="#1E2A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20 h12 c0 -10 12 -10 12 0 h12 v12 c10 0 10 12 0 12 v12 h-36z"/></g>
<text x="382" y="314" font-size="29" font-weight="700" fill="#1E2A44" text-anchor="start">Add the kit</text>
<text x="382" y="364" font-size="23" fill="#1E2A44" text-anchor="start">Two commands inside</text>
<text x="382" y="396" font-size="23" fill="#1E2A44" text-anchor="start">Claude Code, copied</text>
<text x="382" y="427" font-size="23" fill="#1E2A44" text-anchor="start">from this page.</text>
<line x1="636" y1="367" x2="656" y2="367" stroke="#4A5878" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="660" y="172" width="276" height="390" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="712" cy="228" r="30" fill="#5CC8A8" stroke="#1E2A44" stroke-width="4"/><text x="712" y="240" font-size="33" font-weight="700" fill="#123B33" text-anchor="middle">3</text>
<g transform="translate(844 194) scale(0.95)" fill="none" stroke="#1E2A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16 h18 l6 6 h28 v30 h-52z"/></g>
<text x="686" y="314" font-size="29" font-weight="700" fill="#1E2A44" text-anchor="start">Open your game</text>
<text x="686" y="364" font-size="23" fill="#1E2A44" text-anchor="start">Start Claude Code</text>
<text x="686" y="396" font-size="23" fill="#1E2A44" text-anchor="start">in the folder that</text>
<text x="686" y="427" font-size="23" fill="#1E2A44" text-anchor="start">holds</text>
<text x="686" y="459" font-size="23" fill="#1E2A44" text-anchor="start">project.godot.</text>
<line x1="940" y1="367" x2="960" y2="367" stroke="#4A5878" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="964" y="172" width="276" height="390" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="1016" cy="228" r="30" fill="#EE7FA0" stroke="#1E2A44" stroke-width="4"/><text x="1016" y="240" font-size="33" font-weight="700" fill="#4A1024" text-anchor="middle">4</text>
<g transform="translate(1148 194) scale(0.95)" fill="none" stroke="#1E2A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12 h48 v30 h-28 l-12 10 v-10 h-8z"/><path d="M20 27 h2 M31 27 h2 M42 27 h2"/></g>
<text x="990" y="314" font-size="29" font-weight="700" fill="#1E2A44" text-anchor="start">Say hello</text>
<text x="990" y="364" font-size="23" fill="#1E2A44" text-anchor="start">Type the bootstrap</text>
<text x="990" y="396" font-size="23" fill="#1E2A44" text-anchor="start">command and answer</text>
<text x="990" y="427" font-size="23" fill="#1E2A44" text-anchor="start">a few questions.</text>
<text x="990" y="459" font-size="23" fill="#1E2A44" text-anchor="start">APR takes a</text>
<text x="990" y="491" font-size="23" fill="#1E2A44" text-anchor="start">suggestion.</text>
</g>
</g>
</svg>
