<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1288" width="1280" height="1288" role="img" aria-labelledby="t d">
<title id="t">What a session looks like</title>
<desc id="d">An illustrated session. You type resume; Claude says it got two changes from your laptop and suggests one task, the wall jump. You say APR to take its suggestions. It asks one question at a time, each with a recommendation. It builds it, says 4 checks passed and what to try. You say it feels floaty; it suggests changing one tuning value. You say yes and save work; it asks before committing, backs up to GitHub and says it&#x27;s safe to clear.</desc>
