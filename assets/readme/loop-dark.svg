<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="880" height="456" role="img" aria-labelledby="t d">
<title id="t">How a session goes</title>
<desc id="d">A loop of six steps: resume, one task, plan it, build and check, you play it, save work. Then a fresh session starts the loop again.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#A9B5C9"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="1.5" y="1.5" width="877" height="453" rx="28" fill="#151B26" stroke="#2B3547" stroke-width="3"/>
<path d="M160 84 H798 a40 40 0 0 1 40 40 V260 a40 40 0 0 1 -40 40 H160" fill="none" stroke="#34405A" stroke-width="18" stroke-linecap="round"/>
<path d="M160 84 H798 a40 40 0 0 1 40 40 V260 a40 40 0 0 1 -40 40 H160" fill="none" stroke="#151B26" stroke-width="3" stroke-dasharray="14 12"/>
<circle cx="160" cy="84" r="38" fill="#5FA3D6" stroke="#0A0E15" stroke-width="4"/>
<text x="160" y="96" font-size="34" font-weight="700" fill="#0E2C44" text-anchor="middle">1</text>
<text x="160" y="164" font-size="31" font-weight="700" fill="#EEF2F8" text-anchor="middle">resume</text>
<text x="160" y="198" font-size="25" fill="#A9B5C9" text-anchor="middle">where you stopped</text>
<circle cx="440" cy="84" r="38" fill="#F5C24C" stroke="#0A0E15" stroke-width="4"/>
<text x="440" y="96" font-size="34" font-weight="700" fill="#4A3300" text-anchor="middle">2</text>
<text x="440" y="164" font-size="31" font-weight="700" fill="#EEF2F8" text-anchor="middle">one task</text>
<text x="440" y="198" font-size="25" fill="#A9B5C9" text-anchor="middle">one small job</text>
<circle cx="720" cy="84" r="38" fill="#8E7CC3" stroke="#0A0E15" stroke-width="4"/>
<text x="720" y="96" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="720" y="164" font-size="31" font-weight="700" fill="#EEF2F8" text-anchor="middle">plan it</text>
<text x="720" y="198" font-size="25" fill="#A9B5C9" text-anchor="middle">your OK first</text>
<circle cx="720" cy="300" r="38" fill="#5CC8A8" stroke="#0A0E15" stroke-width="4"/>
<text x="720" y="312" font-size="34" font-weight="700" fill="#123B33" text-anchor="middle">4</text>
<text x="720" y="380" font-size="31" font-weight="700" fill="#EEF2F8" text-anchor="middle">build + check</text>
<text x="720" y="414" font-size="25" fill="#A9B5C9" text-anchor="middle">checks run first</text>
<circle cx="440" cy="300" r="38" fill="#EE7FA0" stroke="#0A0E15" stroke-width="4"/>
<text x="440" y="312" font-size="34" font-weight="700" fill="#4A1024" text-anchor="middle">5</text>
<text x="440" y="380" font-size="31" font-weight="700" fill="#EEF2F8" text-anchor="middle">you play it</text>
<text x="440" y="414" font-size="25" fill="#A9B5C9" text-anchor="middle">say how it feels</text>
<circle cx="160" cy="300" r="38" fill="#D97757" stroke="#0A0E15" stroke-width="4"/>
<text x="160" y="312" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="160" y="380" font-size="31" font-weight="700" fill="#EEF2F8" text-anchor="middle">save work</text>
<text x="160" y="414" font-size="25" fill="#A9B5C9" text-anchor="middle">only on your yes</text>
</g>
</svg>
