<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 616" width="1280" height="616" role="img" aria-labelledby="t d">
<title id="t">Is it for you?</title>
<desc id="d">Four cards. Never written code: made for you, start with the beginner&#x27;s guide. Made a few things: also for you, five minutes to install. A game jam or a weekend try: plain Claude Code is enough. A seasoned developer: it may feel slow; take the parts you like.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5878"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="1280" height="616" rx="32" fill="#FFF7EC"/>
<g transform="translate(0 -92)">
<rect x="56" y="140" width="568" height="250" rx="24" fill="#FFFFFF" stroke="#5CC8A8" stroke-width="4"/>
<circle cx="106" cy="196" r="24" fill="#5CC8A8"/><path d="M95.2 196 l7.68 8.16 l14.399999999999999 -15.84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="206" font-size="30" font-weight="700" fill="#1E2A44" text-anchor="start">Never written code</text>
<text x="92" y="266" font-size="25" fill="#1E2A44" text-anchor="start">Made for you. Start with the beginner&#x27;s</text>
<text x="92" y="300" font-size="25" fill="#1E2A44" text-anchor="start">guide: about an hour, from nothing</text>
<text x="92" y="335" font-size="25" fill="#1E2A44" text-anchor="start">installed to something moving on</text>
<text x="92" y="370" font-size="25" fill="#1E2A44" text-anchor="start">screen.</text>
<rect x="656" y="140" width="568" height="250" rx="24" fill="#FFFFFF" stroke="#5CC8A8" stroke-width="4"/>
<circle cx="706" cy="196" r="24" fill="#5CC8A8"/><path d="M695.2 196 l7.68 8.16 l14.399999999999999 -15.84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="748" y="206" font-size="30" font-weight="700" fill="#1E2A44" text-anchor="start">Made a few things</text>
<text x="692" y="266" font-size="25" fill="#1E2A44" text-anchor="start">Also for you. Five minutes to install,</text>
<text x="692" y="300" font-size="25" fill="#1E2A44" text-anchor="start">then say resume each session.</text>
<rect x="56" y="418" width="568" height="250" rx="24" fill="#FFFFFF" stroke="#F5C24C" stroke-width="4"/>
<circle cx="106" cy="474" r="24" fill="#F5C24C"/><text x="106" y="484" font-size="34" font-weight="700" fill="#4A3300" text-anchor="middle">~</text>
<text x="148" y="484" font-size="30" font-weight="700" fill="#1E2A44" text-anchor="start">A game jam or a weekend try</text>
<text x="92" y="544" font-size="25" fill="#1E2A44" text-anchor="start">Plain Claude Code is enough. The kit</text>
<text x="92" y="578" font-size="25" fill="#1E2A44" text-anchor="start">pays off on a game you&#x27;ll work on for</text>
<text x="92" y="613" font-size="25" fill="#1E2A44" text-anchor="start">weeks.</text>
<rect x="656" y="418" width="568" height="250" rx="24" fill="#FFFFFF" stroke="#F5C24C" stroke-width="4"/>
<circle cx="706" cy="474" r="24" fill="#F5C24C"/><text x="706" y="484" font-size="34" font-weight="700" fill="#4A3300" text-anchor="middle">~</text>
<text x="748" y="484" font-size="30" font-weight="700" fill="#1E2A44" text-anchor="start">A seasoned developer</text>
<text x="692" y="544" font-size="25" fill="#1E2A44" text-anchor="start">It may feel slow. Take the parts you</text>
<text x="692" y="578" font-size="25" fill="#1E2A44" text-anchor="start">like: every rule can be changed or</text>
<text x="692" y="613" font-size="25" fill="#1E2A44" text-anchor="start">turned off.</text>
</g>
</g>
</svg>
