<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1324" width="1280" height="1324" role="img" aria-labelledby="t d">
<title id="t">Real things that went wrong</title>
<desc id="d">Six real problems from the games that built this kit, each now a rule or a check: bugs it should have caught; notes that grew to 875 lines; Claude forgot what we decided; three games with three note layouts; Claude undid a jump we tuned by hand; one computer redid another&#x27;s work. They help, but don&#x27;t make Claude perfect: you still play and decide.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5878"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="1280" height="1324" rx="32" fill="#FFF7EC"/>
<text x="56" y="84" font-size="46" font-weight="700" fill="#1E2A44" text-anchor="start" class="heading">Real things that went wrong</text>
<text x="56" y="128" font-size="26" fill="#4A5878" text-anchor="start" class="heading">From the games that built this kit. Each one is now a rule or a check.</text>
<rect x="52" y="170" width="376" height="520" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<path d="M52 194 a24 24 0 0 1 24 -24 h328 a24 24 0 0 1 24 24 v58 h-376z" fill="#EE7FA0"/>
<text x="78" y="230" font-size="38" font-weight="700" fill="#4A1024" text-anchor="start">again &amp; again</text>
<text x="78" y="294" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">Bugs it should have</text>
<text x="78" y="331" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">caught</text>
<text x="78" y="375" font-size="23" fill="#4A5878" text-anchor="start">Claude kept handing over</text>
<text x="78" y="406" font-size="23" fill="#4A5878" text-anchor="start">work that didn&#x27;t run. A</text>
<text x="78" y="438" font-size="23" fill="#4A5878" text-anchor="start">quick test would have caught</text>
<text x="78" y="470" font-size="23" fill="#4A5878" text-anchor="start">it.</text>
<line x1="78" y1="522" x2="402" y2="522" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="94" cy="560" r="16" fill="#EE7FA0"/><path d="M86.8 560 l5.12 5.44 l9.6 -10.56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="568" font-size="19" font-weight="700" fill="#4A5878" text-anchor="start" letter-spacing="1.5">NOW THE KIT</text>
<text x="78" y="610" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">It checks its own work</text>
<text x="78" y="642" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">before you see it.</text>
<rect x="452" y="170" width="376" height="520" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<path d="M452 194 a24 24 0 0 1 24 -24 h328 a24 24 0 0 1 24 24 v58 h-376z" fill="#F5C24C"/>
<text x="478" y="230" font-size="38" font-weight="700" fill="#4A3300" text-anchor="start">875 lines</text>
<text x="478" y="294" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">The notes got huge</text>
<text x="478" y="337" font-size="23" fill="#4A5878" text-anchor="start">Its notes grew to 875 lines,</text>
<text x="478" y="369" font-size="23" fill="#4A5878" text-anchor="start">all read every session.</text>
<text x="478" y="401" font-size="23" fill="#4A5878" text-anchor="start">Slow, and costly.</text>
<line x1="478" y1="522" x2="802" y2="522" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="494" cy="560" r="16" fill="#F5C24C"/><path d="M486.8 560 l5.12 5.44 l9.6 -10.56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520" y="568" font-size="19" font-weight="700" fill="#4A5878" text-anchor="start" letter-spacing="1.5">NOW THE KIT</text>
<text x="478" y="610" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">Notes have size limits,</text>
<text x="478" y="642" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">and a check warns.</text>
<rect x="852" y="170" width="376" height="520" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<path d="M852 194 a24 24 0 0 1 24 -24 h328 a24 24 0 0 1 24 24 v58 h-376z" fill="#5CC8A8"/>
<text x="878" y="230" font-size="38" font-weight="700" fill="#123B33" text-anchor="start">forgot</text>
<text x="878" y="294" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">It forgot what we</text>
<text x="878" y="331" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">decided</text>
<text x="878" y="375" font-size="23" fill="#4A5878" text-anchor="start">We agreed how something</text>
<text x="878" y="406" font-size="23" fill="#4A5878" text-anchor="start">should work. Weeks later,</text>
<text x="878" y="438" font-size="23" fill="#4A5878" text-anchor="start">Claude did it differently.</text>
<line x1="878" y1="522" x2="1202" y2="522" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="894" cy="560" r="16" fill="#5CC8A8"/><path d="M886.8 560 l5.12 5.44 l9.6 -10.56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="920" y="568" font-size="19" font-weight="700" fill="#4A5878" text-anchor="start" letter-spacing="1.5">NOW THE KIT</text>
<text x="878" y="610" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">Decisions are written</text>
<text x="878" y="642" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">down and read first.</text>
<rect x="52" y="714" width="376" height="520" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<path d="M52 738 a24 24 0 0 1 24 -24 h328 a24 24 0 0 1 24 24 v58 h-376z" fill="#5FA3D6"/>
<text x="78" y="774" font-size="38" font-weight="700" fill="#0E2C44" text-anchor="start">29 → 0</text>
<text x="78" y="838" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">Every game, a</text>
<text x="78" y="875" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">different mess</text>
<text x="78" y="919" font-size="23" fill="#4A5878" text-anchor="start">Three games kept their notes</text>
<text x="78" y="950" font-size="23" fill="#4A5878" text-anchor="start">three different ways.</text>
<text x="78" y="982" font-size="23" fill="#4A5878" text-anchor="start">Nothing was where you&#x27;d</text>
<text x="78" y="1014" font-size="23" fill="#4A5878" text-anchor="start">look.</text>
<line x1="78" y1="1066" x2="402" y2="1066" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="94" cy="1104" r="16" fill="#5FA3D6"/><path d="M86.8 1104 l5.12 5.44 l9.6 -10.56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="1112" font-size="19" font-weight="700" fill="#4A5878" text-anchor="start" letter-spacing="1.5">NOW THE KIT</text>
<text x="78" y="1154" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">One layout in every</text>
<text x="78" y="1186" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">game: 29 problems to 0.</text>
<rect x="452" y="714" width="376" height="520" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<path d="M452 738 a24 24 0 0 1 24 -24 h328 a24 24 0 0 1 24 24 v58 h-376z" fill="#D97757"/>
<text x="478" y="774" font-size="38" font-weight="700" fill="#3D1708" text-anchor="start">undone</text>
<text x="478" y="838" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">Your tweaks, gone</text>
<text x="478" y="881" font-size="23" fill="#4A5878" text-anchor="start">We tuned a jump by hand in</text>
<text x="478" y="913" font-size="23" fill="#4A5878" text-anchor="start">Godot. Claude quietly undid</text>
<text x="478" y="945" font-size="23" fill="#4A5878" text-anchor="start">it.</text>
<line x1="478" y1="1066" x2="802" y2="1066" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="494" cy="1104" r="16" fill="#D97757"/><path d="M486.8 1104 l5.12 5.44 l9.6 -10.56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520" y="1112" font-size="19" font-weight="700" fill="#4A5878" text-anchor="start" letter-spacing="1.5">NOW THE KIT</text>
<text x="478" y="1154" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">Your changes are yours.</text>
<text x="478" y="1186" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">It asks first.</text>
<rect x="852" y="714" width="376" height="520" rx="24" fill="#FFFFFF" stroke="#E6DCCB" stroke-width="3"/>
<path d="M852 738 a24 24 0 0 1 24 -24 h328 a24 24 0 0 1 24 24 v58 h-376z" fill="#8E7CC3"/>
<text x="878" y="774" font-size="38" font-weight="700" fill="#241A44" text-anchor="start">twice</text>
<text x="878" y="838" font-size="27" font-weight="700" fill="#1E2A44" text-anchor="start">Work done twice</text>
<text x="878" y="881" font-size="23" fill="#4A5878" text-anchor="start">One computer redid work</text>
<text x="878" y="913" font-size="23" fill="#4A5878" text-anchor="start">another computer had already</text>
<text x="878" y="945" font-size="23" fill="#4A5878" text-anchor="start">finished.</text>
<line x1="878" y1="1066" x2="1202" y2="1066" stroke="#E6DCCB" stroke-width="3"/>
<circle cx="894" cy="1104" r="16" fill="#8E7CC3"/><path d="M886.8 1104 l5.12 5.44 l9.6 -10.56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="920" y="1112" font-size="19" font-weight="700" fill="#4A5878" text-anchor="start" letter-spacing="1.5">NOW THE KIT</text>
<text x="878" y="1154" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">Each session checks your</text>
<text x="878" y="1186" font-size="23" font-weight="700" fill="#1E2A44" text-anchor="start">other computers first.</text>
<text x="640" y="1284" font-size="24" fill="#4A5878" text-anchor="middle">These help a lot. They don&#x27;t make Claude perfect: you still play and decide.</text>
</g>
</svg>
