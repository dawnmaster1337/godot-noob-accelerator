<text x="660" y="438" font-size="23" fill="#1E2A44" text-anchor="start">How Claude</text>
<text x="660" y="470" font-size="23" fill="#1E2A44" text-anchor="start">behaves: CLAUDE.md</text>
<text x="660" y="501" font-size="23" fill="#1E2A44" text-anchor="start">and</text>
<text x="660" y="533" font-size="23" fill="#1E2A44" text-anchor="start">.claude/rules/.</text>
<line x1="769" y1="280" x2="769" y2="324" stroke="#4A5878" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#head)"/>
<rect x="926" y="330" width="266" height="290" rx="24" fill="#FFFFFF" stroke="#EE7FA0" stroke-width="4"/>
<rect x="926" y="330" width="266" height="64" rx="24" fill="#EE7FA0"/>
<rect x="926" y="370" width="266" height="24" rx="0" fill="#EE7FA0"/>
<text x="950" y="374" font-size="30" font-weight="700" fill="#4A1024" text-anchor="start">Checks</text>
<text x="950" y="438" font-size="23" fill="#1E2A44" text-anchor="start">tools/dev.sh:</text>
<text x="950" y="470" font-size="23" fill="#1E2A44" text-anchor="start">check, run, lint,</text>
<text x="950" y="501" font-size="23" fill="#1E2A44" text-anchor="start">budget. Proof, not</text>
<text x="950" y="533" font-size="23" fill="#1E2A44" text-anchor="start">promises.</text>
