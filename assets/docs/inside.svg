<text x="170" y="728" font-size="30" font-weight="700" fill="#1E2A44" text-anchor="start">Your project&#x27;s notes</text>
<text x="170" y="772" font-size="24" fill="#1E2A44" text-anchor="start">STATUS, plans, decisions, known bugs and memory: plain files in git, on every</text>
