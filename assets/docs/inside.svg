<text x="560" y="206" font-size="34" font-weight="700" fill="#FFF7EC" text-anchor="start">Claude Code</text>
<text x="560" y="244" font-size="23" fill="#FFF7EC" text-anchor="start">reads the kit, works in your project</text>
<rect x="56" y="330" width="266" height="290" rx="24" fill="#FFFFFF" stroke="#5FA3D6" stroke-width="4"/>
<rect x="56" y="330" width="266" height="64" rx="24" fill="#5FA3D6"/>
<rect x="56" y="370" width="266" height="24" rx="0" fill="#5FA3D6"/>
<text x="80" y="374" font-size="30" font-weight="700" fill="#0E2C44" text-anchor="start">Skills</text>
<text x="80" y="438" font-size="23" fill="#1E2A44" text-anchor="start">Recipes your words</text>
<text x="80" y="470" font-size="23" fill="#1E2A44" text-anchor="start">start: resume,</text>
<text x="80" y="501" font-size="23" fill="#1E2A44" text-anchor="start">plan-feature,</text>
<text x="80" y="533" font-size="23" fill="#1E2A44" text-anchor="start">save-work, update…</text>
