<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="t d">
<title id="t">Inside the kit</title>
<desc id="d">You say a few words to Claude Code, which reads the kit. The kit has skills (recipes your words start, like resume and save-work), hooks (run on their own: the start card, the file guard, lint, the stop check), rules (CLAUDE.md and .claude/rules/) and checks (tools/dev.sh). Everything it learns goes into your project&#x27;s notes: plain files in git, on every computer.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5878"/></marker></defs>
