<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
<title id="t">Three words to remember</title>
<desc id="d">resume to start a session; save work after each thing you like; wrap up at the end of the day.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A5878"/></marker></defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="1280" height="380" rx="32" fill="#FFF7EC"/>
<text x="56" y="84" font-size="46" font-weight="700" fill="#1E2A44" text-anchor="start" class="heading">Three words to remember</text>
<text x="56" y="128" font-size="26" fill="#4A5878" text-anchor="start" class="heading">Everything else, Claude asks you.</text>
<rect x="56" y="160" width="368" height="180" rx="24" fill="#FFFFFF" stroke="#5FA3D6" stroke-width="5"/>
<text x="240" y="242" font-size="44" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#1E2A44" text-anchor="middle">resume</text>
<text x="240" y="296" font-size="25" fill="#4A5878" text-anchor="middle">to start a session</text>
