<text x="636" y="242" font-size="44" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#1E2A44" text-anchor="middle">save work</text>
<text x="636" y="296" font-size="25" fill="#4A5878" text-anchor="middle">after each thing you like</text>
<rect x="848" y="160" width="368" height="180" rx="24" fill="#FFFFFF" stroke="#D97757" stroke-width="5"/>
<text x="1032" y="242" font-size="44" font-weight="700" font-family="'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" fill="#1E2A44" text-anchor="middle">wrap up</text>
<text x="1032" y="296" font-size="25" fill="#4A5878" text-anchor="middle">at the end of the day</text>
