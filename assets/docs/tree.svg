<title id="t">What it adds to your game</title>
<desc id="d">A file tree of a game with the kit. Claude reads CLAUDE.md, .claude/rules/ and .claude/memory/. You read docs/STATUS.md, docs/plans/, docs/decisions/, docs/known-bugs.md, docs/guides/start-here.md and use inbox/. tools/dev.sh, tests/ and .githooks/ run on their own.</desc>
